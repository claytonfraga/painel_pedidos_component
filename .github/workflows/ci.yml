name: CI/CD

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build e validacao (mvn -U clean verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e validacao
        run: mvn -U clean verify

      - name: Publicar artefato (jar)
        uses: actions/upload-artifact@v4
        with:
          name: PainelPedidos_MVP_PassiveView
          path: target/*.jar
          if-no-files-found: error

  release:
    name: Release (tags v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empacotar
        run: mvn -U clean verify

      - name: Criar Release com o jar
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          generate_release_notes: true
