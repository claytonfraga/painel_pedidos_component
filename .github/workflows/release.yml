name: Release

# Etapa 1 de 2: publica a biblioteca no GitHub. Nao espera o JitPack.
# A criacao da Release e o que faz o JitPack construir o artefato ("Get it").
# A verificacao do JitPack e do exemplo vive em verificar-jitpack.yml, que
# dispara quando este workflow termina.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    name: Verifica, publica a Release com o jar do componente
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir a tag alvo
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "${TAG}" ] || [ "${TAG}" = "main" ]; then
            TAG="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}"

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Alinhar a versao do componente com a tag (sem o 'v')
        working-directory: painel-pedidos
        run: mvn -B -q versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Gate de qualidade antes de publicar
        working-directory: painel-pedidos
        run: mvn -U clean verify

      - name: Publicar a Release com o jar do componente
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "A Release ${TAG} ja existe; atualizando os assets."
            gh release upload "${TAG}" painel-pedidos/target/painel-pedidos-*.jar --clobber
          else
            gh release create "${TAG}" \
              painel-pedidos/target/painel-pedidos-*.jar \
              --title "${TAG}" \
              --generate-notes
          fi
