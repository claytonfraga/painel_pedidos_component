# Configuracao do JitPack para este repositorio.
#
# O repositorio tem dois projetos independentes: o componente (painel-pedidos/) e
# o exemplo (exemplo/). Nao ha pom de agregacao na raiz, entao o build do JitPack
# precisa entrar no diretorio do componente.
#
# Este repositorio e um template: cada autor publica o seu artefato, que o JitPack expoe
# como com.github.<usuario>.<repositorio>:painel-pedidos:VERSAO. A publicacao e disparada
# por uma GitHub Release (ou por uma tag), que o workflow .github/workflows/release.yml cria.
#
# jdk: o projeto exige Java 21 (o maven-enforcer-plugin recusa outro JDK, entao um
# valor errado aqui falha alto e claro, em vez de publicar artefato inconsistente).
jdk:
  - openjdk21

install:
  - cd painel-pedidos && mvn -B -DskipTests clean install
