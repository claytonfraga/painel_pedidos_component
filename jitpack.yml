# Configuracao do JitPack para este repositorio.
#
# Este repositorio e um template: cada autor publica o seu artefato, que o JitPack
# expoe como com.github.<usuario>.<repositorio>:<modulo>:VERSAO. A publicacao e
# disparada por uma GitHub Release (ou por uma tag).
#
# Nao ha pom de agregacao na raiz, entao o build entra no diretorio do componente.
#
# A imagem padrao do JitPack traz um Maven antigo (< 3.6.3), e o
# maven-enforcer-plugin 3.5.0 exige Maven >= 3.6.3 ("requires Maven version
# 3.6.3"). Por isso um Maven moderno e instalado antes do build.
jdk:
  - openjdk21

before_install:
  - curl -sL https://archive.apache.org/dist/maven/maven-3/3.9.10/binaries/apache-maven-3.9.10-bin.tar.gz -o /tmp/maven.tar.gz
  - mkdir -p /tmp/maven && tar xzf /tmp/maven.tar.gz -C /tmp/maven

install:
  - /tmp/maven/apache-maven-3.9.10/bin/mvn -B -DskipTests clean install -f painel-pedidos/pom.xml
